<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW Premium Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Tahoma,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url("https://images.unsplash.com/photo-1549924231-f129b911e442") no-repeat center center/cover;
  overflow:hidden;
}

/* Dark overlay */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg, rgba(0,0,0,.8), rgba(0,0,0,.4));
  z-index:0;
}

/* Glass Card */
.login-container{
  position:relative;
  z-index:1;
  width:370px;
  padding:45px 35px;
  border-radius:25px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 15px 40px rgba(0,0,0,.6);
  text-align:center;
  color:#fff;
  animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

.login-container h2{
  margin-bottom:30px;
  letter-spacing:2px;
  font-weight:600;
  color:#1e88e5;
}

/* Input */
.input-box{
  position:relative;
  margin-bottom:22px;
}

.input-box input{
  width:100%;
  padding:12px 45px 12px 15px;
  border:none;
  outline:none;
  border-radius:30px;
  background:rgba(255,255,255,0.15);
  color:#fff;
  font-size:14px;
  transition:.3s;
}

.input-box input:focus{
  background:rgba(255,255,255,0.25);
  box-shadow:0 0 10px #1e88e5;
}

.input-box span{
  position:absolute;
  top:50%;
  left:15px;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:14px;
}

/* Options */
.options{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:20px;
}

.options a{
  color:#ccc;
  text-decoration:none;
}

.options a:hover{
  color:#fff;
  text-decoration:underline;
}

/* Button */
.login-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#1e88e5,#1565c0);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.login-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #1e88e5;
}

.footer{
  margin-top:20px;
  font-size:12px;
  color:#bbb;
}

/* Error */
.error{
  font-size:12px;
  color:#ff5252;
  margin-bottom:10px;
  display:none;
}

</style>
</head>

<body>

<div class="login-container">
  <h2>BMW LOGIN</h2>

  <div class="error" id="errorMsg">يرجى إدخال جميع البيانات</div>

  <div class="input-box">
    <input type="text" id="username" placeholder="Username">
    <span>👤</span>
  </div>

  <div class="input-box">
    <input type="password" id="password" placeholder="Password">
    <span onclick="togglePassword()">👁</span>
  </div>

  <div class="options">
    <label><input type="checkbox"> تذكرني</label>
    <a href="#">نسيت كلمة المرور؟</a>
  </div>

  <button class="login-btn" onclick="login()">Login</button>

  <div class="footer">
    Powered by BMW Style 🚗
  </div>
</div>

<script>
function togglePassword(){
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

function login(){
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  const error = document.getElementById("errorMsg");

  if(!user || !pass){
    error.style.display="block";
    return;
  }

  error.style.display="none";

  // هنا تقدر تربط Firebase
  alert("Login Successful 🚀");
}
</script>

</body>
</html>
