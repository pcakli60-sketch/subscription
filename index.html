<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة الاشتراكات PRO</title>

<style>
:root{
--main:#1976d2;
--success:#2e7d32;
--warning:#ef6c00;
--danger:#c62828;
--bg:#f4f6f9;
--card:#ffffff;
--unpaid:#fdecea;
}
body{font-family:Arial;background:var(--bg);margin:0;padding:15px}
h2{text-align:center;color:var(--main)}
.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
input,select,button{width:100%;padding:10px;margin:5px 0;font-size:14px}
button{border:none;border-radius:8px;cursor:pointer;color:#fff}
.main{background:var(--main)}
.success{background:var(--success)}
.warning{background:var(--warning)}
.danger{background:var(--danger)}
.logout{background:var(--danger);width:auto;padding:6px 12px}
.filters,.stats{display:flex;gap:5px;flex-wrap:wrap}
.filters button,.stats div{flex:1}
.stats div{background:#eef3fa;padding:10px;border-radius:10px;text-align:center;font-weight:bold}
table{width:100%;border-collapse:collapse;min-width:1200px}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:13px}
th{background:var(--main);color:#fff}
.row-ok{background:#e8f5e9}
.row-warn{background:#fff3e0}
.row-expired{background:#fdecea}
.row-unpaid{background:var(--unpaid)}
.days-box{padding:4px 8px;border-radius:12px;font-weight:bold}
.days-ok{background:#c8e6c9;color:var(--success)}
.days-warn{background:#ffe0b2;color:var(--warning)}
.days-expired{background:#ffcdd2;color:var(--danger)}
.actions button{padding:5px 8px;margin:2px;font-size:13px}
</style>
</head>
<body>

<div id="loginBox" class="card" style="max-width:380px;margin:120px auto;text-align:center">
<h2>🔐 تسجيل الدخول</h2>
<input id="loginEmail" type="email" placeholder="E-mail">
<input id="loginPass" type="password" placeholder="Mot de passe">
<button class="main" onclick="login()">دخول</button>
</div>

<div id="app" style="display:none">

<div style="display:flex;justify-content:space-between;align-items:center">
<h2>إدارة الاشتراكات</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<input id="search" placeholder="بحث شامل..." onkeyup="onSearch(this.value)">

<div class="filters">
<button class="main" onclick="setFilter('all')">الكل</button>
<button class="success" onclick="setFilter('active')">نشط</button>
<button class="danger" onclick="setFilter('expired')">منتهي</button>
<button class="warning" onclick="setFilter('unpaid')">غير مدفوع</button>
</div>

<div class="card stats">
<div>📦 الكل<br><span id="stTotal">0</span></div>
<div style="color:var(--success)">🟢 نشط<br><span id="stActive">0</span></div>
<div style="color:var(--danger)">🔴 منتهي<br><span id="stExpired">0</span></div>
<div style="color:var(--warning)">❌ غير مدفوع<br><span id="stUnpaid">0</span></div>
</div>

<button class="warning" onclick="sendAlerts()">🔔 إرسال التنبيهات</button>

<div class="card">
<input id="name" placeholder="اسم الزبون">
<input id="phone" placeholder="الهاتف">
<input id="email" placeholder="Email">
<input id="profile" placeholder="Profil">
<select id="product">
<option value="">الخدمة</option>
<option>Netflix</option>
<option>Shahid</option>
<option>IPTV</option>
</select>
<input id="price" type="number" placeholder="السعر">
<input id="days" type="number" placeholder="عدد الأيام">
<button class="main" onclick="addSub()">➕ إضافة اشتراك</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>الاسم</th><th>الهاتف</th><th>Email</th><th>Profil</th>
<th>الخدمة</th><th>السعر</th><th>الانتهاء</th>
<th>⏳ الأيام</th><th>مدفوع</th><th>إجراءات</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain:"systeme-des-abonnements-6a98c.firebaseapp.com",
projectId:"systeme-des-abonnements-6a98c",
storageBucket:"systeme-des-abonnements-6a98c.appspot.com",
messagingSenderId:"74948745712",
appId:"1:74948745712:web:91eab4492f02bde4baa535"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const $=id=>document.getElementById(id);
let subs=[],currentFilter="all",searchText="";

function calcDays(endDate){
if(!endDate) return 0;
let todayStr=new Date().toISOString().split("T")[0];
let today=new Date(todayStr);
let end=new Date(endDate);
return Math.floor((end-today)/86400000);
}

function login(){
auth.signInWithEmailAndPassword($("loginEmail").value,$("loginPass").value)
.catch(e=>alert(e.message));
}
function logout(){auth.signOut();}

auth.onAuthStateChanged(u=>{
$("loginBox").style.display=u?"none":"block";
$("app").style.display=u?"block":"none";
if(u)loadSubs();
});

function loadSubs(){
db.collection("subs").onSnapshot(snapshot=>{
subs=[];
snapshot.forEach(doc=>subs.push({id:doc.id,...doc.data()}));
render();
});
}

function onSearch(v){searchText=v.toLowerCase();render();}
function setFilter(f){currentFilter=f;render();}

async function addSub(){
let days=parseInt($("days").value,10);
if(!days||!$("name").value||!$("phone").value||!$("product").value){
alert("املأ الحقول المطلوبة ⚠");return;
}
let end=new Date();
end.setDate(end.getDate()+days);
let endDate=end.toISOString().split("T")[0];

await db.collection("subs").add({
name:$("name").value,
phone:$("phone").value,
email:$("email").value,
profile:$("profile").value,
product:$("product").value,
price:$("price").value,
endDate:endDate,
paid:false,
alert3Sent:false,
alertExpiredSent:false,
createdAt:new Date()
});

["name","phone","email","profile","product","price","days"]
.forEach(i=>$(i).value="");

alert("✅ تمت الإضافة");
}

async function editSub(id){
let s=subs.find(x=>x.id===id);
let newName=prompt("الاسم",s.name);
if(!newName)return;
await db.collection("subs").doc(id).update({name:newName});
}

async function renewSub(id){
let s=subs.find(x=>x.id===id);
let days=parseInt(prompt("عدد أيام التجديد"),10);
if(!days)return;

let base=new Date(s.endDate);
if(calcDays(s.endDate)<0) base=new Date();
base.setDate(base.getDate()+days);

let newEnd=base.toISOString().split("T")[0];

await db.collection("subs").doc(id).update({
endDate:newEnd,
alert3Sent:false,
alertExpiredSent:false
});
}

async function deleteSub(id){
if(confirm("حذف؟")) await db.collection("subs").doc(id).delete();
}

async function togglePaid(id,val){
await db.collection("subs").doc(id).update({paid:val});
}

function formatPhone(phone){
phone=phone.replace(/\D/g,"");
if(phone.startsWith("0")) phone="213"+phone.substring(1);
return phone;
}

function sendWhatsApp(phone,name,product,endDate,days){
if(!phone)return;
phone=formatPhone(phone);
let msg=days<0?
`مرحباً 👋
اشتراك ${product}
انتهى بتاريخ ${endDate} ⛔
يرجى التجديد.`:
`مرحباً 👋
اشتراك ${product}
سينتهي بتاريخ ${endDate} ⏰
متبقي ${days} أيام.`;
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank");
}

async function sendAlerts(){
let alerts=[];
for(let s of subs){
let diff=calcDays(s.endDate);
if(diff===3&&!s.alert3Sent) alerts.push({type:"before",sub:s});
if(diff<0&&!s.alertExpiredSent) alerts.push({type:"expired",sub:s});
}
if(alerts.length===0){alert("لا توجد تنبيهات حالياً ✅");return;}

let i=0;
function openNext(){
if(i>=alerts.length){alert("تم فتح جميع المحادثات ✅");return;}
let item=alerts[i],s=item.sub,diff=calcDays(s.endDate);
sendWhatsApp(s.phone,s.name,s.product,s.endDate,diff);
db.collection("subs").doc(s.id).update(item.type==="before"?{alert3Sent:true}:{alertExpiredSent:true});
i++;setTimeout(openNext,1200);
}
openNext();
}

function render(){
$("list").innerHTML="";
let t=0,a=0,e=0,u=0;

subs.forEach(s=>{
let diff=calcDays(s.endDate);
t++; diff<0?e++:a++; if(!s.paid)u++;

if(currentFilter==="active"&&diff<0)return;
if(currentFilter==="expired"&&diff>=0)return;
if(currentFilter==="unpaid"&&s.paid)return;

let tr=document.createElement("tr");
tr.className=!s.paid?"row-unpaid":diff<0?"row-expired":diff<=3?"row-warn":"row-ok";

tr.innerHTML=`
<td>${s.name}</td>
<td>${s.phone}</td>
<td>${s.email||"-"}</td>
<td>${s.profile||"-"}</td>
<td>${s.product}</td>
<td>${s.price||"-"}</td>
<td>${s.endDate}</td>
<td><span class="days-box ${diff<0?'days-expired':diff<=3?'days-warn':'days-ok'}">${diff<0?'منتهي':diff}</span></td>
<td><input type="checkbox" ${s.paid?"checked":""} onclick="togglePaid('${s.id}',this.checked)"></td>
<td class="actions">
<button class="main" onclick="sendWhatsApp('${s.phone}','${s.name}','${s.product}','${s.endDate}',${diff})">💬</button>
<button class="success" onclick="editSub('${s.id}')">✏️</button>
<button class="warning" onclick="renewSub('${s.id}')">🔄</button>
<button class="danger" onclick="deleteSub('${s.id}')">🗑</button>
</td>`;
$("list").appendChild(tr);
});

$("stTotal").textContent=t;
$("stActive").textContent=a;
$("stExpired").textContent=e;
$("stUnpaid").textContent=u;
}
</script>

</body>
</html>
