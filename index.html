<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة الاشتراكات PRO</title>

<style>
:root{
--main:#1976d2;
--success:#2e7d32;
--warning:#ef6c00;
--danger:#c62828;
--bg:#f4f6f9;
--card:#ffffff;
--unpaid:#fdecea;
--request:#fff8e1;
}

body{
font-family:Arial;
background:var(--bg);
margin:0;
padding:15px
}

h2{
text-align:center;
color:var(--main)
}

.card{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 3px 8px rgba(0,0,0,.08)
}

input,select,button{
width:100%;
padding:10px;
margin:5px 0;
font-size:14px
}

button{
border:none;
border-radius:8px;
cursor:pointer;
color:#fff
}

.main{background:var(--main)}
.success{background:var(--success)}
.warning{background:var(--warning)}
.danger{background:var(--danger)}

.logout{
background:var(--danger);
width:auto;
padding:6px 12px
}

.filters,.stats{
display:flex;
gap:5px;
flex-wrap:wrap
}

.filters button,.stats div{
flex:1
}

.stats div{
background:#eef3fa;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:bold
}

table{
width:100%;
border-collapse:collapse;
min-width:1200px
}

th,td{
border:1px solid #ddd;
padding:6px;
text-align:center;
font-size:13px
}

th{
background:var(--main);
color:#fff
}

.row-ok{background:#e8f5e9}
.row-warn{background:#fff3e0}
.row-expired{background:#fdecea}
.row-unpaid{background:var(--unpaid)}
.row-request{background:var(--request)}

.days-box{
padding:4px 8px;
border-radius:12px;
font-weight:bold
}

.days-ok{
background:#c8e6c9;
color:var(--success)
}

.days-warn{
background:#ffe0b2;
color:var(--warning)
}

.days-expired{
background:#ffcdd2;
color:var(--danger)
}

.actions button{
padding:5px 8px;
margin:2px;
font-size:13px
}

.request-card{
background:var(--request);
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

.request-actions{
margin-top:10px;
display:flex;
gap:5px;
}

</style>
</head>

<body>

<div id="loginBox" class="card" style="max-width:380px;margin:120px auto;text-align:center">
<h2>🔐 تسجيل الدخول</h2>
<input id="loginEmail" type="email" placeholder="E-mail">
<input id="loginPass" type="password" placeholder="Mot de passe">
<button class="main" onclick="login()">دخول</button>
</div>

<div id="app" style="display:none">

<div style="display:flex;justify-content:space-between;align-items:center">
<h2>إدارة الاشتراكات</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<input id="search" placeholder="بحث شامل..." onkeyup="onSearch(this.value)">

<div class="filters">
<button class="main" onclick="setFilter('all')">الكل</button>
<button class="success" onclick="setFilter('active')">نشط</button>
<button class="danger" onclick="setFilter('expired')">منتهي</button>
<button class="warning" onclick="setFilter('unpaid')">غير مدفوع</button>
<button class="warning" onclick="setFilter('request')">الطلبات</button>
</div>

<div class="card stats">
<div>📦 الكل<br><span id="stTotal">0</span></div>
<div style="color:var(--success)">🟢 نشط<br><span id="stActive">0</span></div>
<div style="color:var(--danger)">🔴 منتهي<br><span id="stExpired">0</span></div>
<div style="color:var(--warning)">❌ غير مدفوع<br><span id="stUnpaid">0</span></div>
</div>

<button class="warning" onclick="sendAlerts()">🔔 إرسال التنبيهات</button>

<div class="card">
<input id="name" placeholder="اسم الزبون">
<input id="phone" placeholder="الهاتف">
<input id="email" placeholder="Email">
<input id="profile" placeholder="Profil">
<input id="password" placeholder="Mode passe">
<input id="pin" placeholder="Code PIN">

<select id="product">
<option value="">الخدمة</option>
<option>ChatGPT</option>
<option>Netflix</option>
<option>Disney+</option>
<option>Prime Video</option>
<option>Shahid VIP</option>
<option>IPTV</option>
<option>Snapchat+</option>
<option>YouTube Premium</option>
<option>Game Pass Ultimate</option>
<option>Crunchyroll</option>
<option>CapCut Pro</option>
<option>Canva Pro</option>
</select>

<input id="price" type="number" placeholder="السعر">
<input id="days" type="number" placeholder="عدد الأيام">

<button class="main" onclick="addSub()">➕ إضافة اشتراك</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>Email</th>
<th>Profil</th>
<th>Mode passe</th>
<th>PIN</th>
<th>الخدمة</th>
<th>السعر</th>
<th>الانتهاء</th>
<th>⏳ الأيام</th>
<th>مدفوع</th>
<th>إجراءات</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain:"systeme-des-abonnements-6a98c.firebaseapp.com",
projectId:"systeme-des-abonnements-6a98c",
storageBucket:"systeme-des-abonnements-6a98c.appspot.com",
messagingSenderId:"74948745712",
appId:"1:74948745712:web:ea9140bdf7dafb85baa535"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const $=id=>document.getElementById(id);

let subs=[];
let currentFilter="all";
let searchText="";

function login(){
auth.signInWithEmailAndPassword(
$("loginEmail").value,
$("loginPass").value
).catch(e=>alert(e.message));
}

function logout(){
auth.signOut();
}

auth.onAuthStateChanged(u=>{
$("loginBox").style.display=u?"none":"block";
$("app").style.display=u?"block":"none";
if(u)loadSubs();
});

function loadSubs(){
db.collection("subs")
.onSnapshot(snapshot=>{

subs=[];

snapshot.forEach(doc=>{
subs.push({
id:doc.id,
...doc.data()
});
});

render();

});
}

function getDateFromEnd(end){
if(!end) return null;
if(end.seconds) return new Date(end.seconds*1000);
return new Date(end);
}

function calcDays(end){

let endDate=getDateFromEnd(end);
if(!endDate) return 0;

let today=new Date();
today=new Date(
today.getFullYear(),
today.getMonth(),
today.getDate()
);

endDate=new Date(
endDate.getFullYear(),
endDate.getMonth(),
endDate.getDate()
);

return Math.floor((endDate-today)/86400000);

}

function onSearch(v){
searchText=v.toLowerCase();
render();
}

function setFilter(f){
currentFilter=f;
render();
}

async function addSub(){

let days=parseInt($("days").value,10);

if(!days || !$("name").value || !$("phone").value){
alert("املأ الحقول");
return;
}

let snap = await db.collection("subs")
.orderBy("counter","desc")
.limit(1)
.get();

let counter=1;

if(!snap.empty){
counter=snap.docs[0].data().counter+1;
}

let now=new Date();
let end=new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()+days
);

await db.collection("subs").add({

counter:counter,
name:$("name").value,
phone:$("phone").value,
email:$("email").value,
profile:$("profile").value,
password:$("password").value,
pin:$("pin").value,
product:$("product").value,
price:$("price").value,

end:firebase.firestore.Timestamp.fromDate(end),

paid:false,
request:false,

alert3Sent:false,
alertExpiredSent:false,

createdAt:firebase.firestore.Timestamp.now()

});

[
"name",
"phone",
"email",
"profile",
"password",
"pin",
"product",
"price",
"days"
].forEach(i=>$(i).value="");

alert("تمت الإضافة");

}
function render(){

$("list").innerHTML="";

let t=0,a=0,e=0,u=0;

subs.sort((a,b)=>{
if(a.request && !b.request) return -1;
if(!a.request && b.request) return 1;
return (b.counter||0)-(a.counter||0);
});

subs.forEach(s=>{

let diff=calcDays(s.end);

if(searchText){

let txt=(
(s.counter||"")+
(s.name||"")+
(s.phone||"")+
(s.email||"")+
(s.profile||"")+
(s.password||"")+
(s.pin||"")+
(s.product||"")+
(s.price||"")
).toLowerCase();

if(!txt.includes(searchText)) return;

}

if(currentFilter==="active" && diff<0) return;
if(currentFilter==="expired" && diff>=0) return;
if(currentFilter==="unpaid" && s.paid) return;
if(currentFilter==="request" && !s.request) return;

t++;
if(diff<0) e++; else a++;
if(!s.paid) u++;

let endDate=getDateFromEnd(s.end);
let endText=endDate?endDate.toLocaleDateString("ar-DZ"):"-";

let tr=document.createElement("tr");

tr.className=
s.request?"row-request":
!s.paid?"row-unpaid":
diff<0?"row-expired":
diff<=3?"row-warn":
"row-ok";

tr.innerHTML=`

<td>${s.counter||"-"}</td>
<td>${s.name||""}</td>
<td>${s.phone||""}</td>
<td>${s.email||""}</td>
<td>${s.profile||""}</td>
<td>${s.password||""}</td>
<td>${s.pin||""}</td>
<td>${s.product||""}</td>
<td>${s.price||""}</td>
<td>${endText}</td>

<td>
<span class="days-box ${
diff<0?'days-expired':
diff<=3?'days-warn':
'days-ok'
}">
${diff<0?'منتهي':diff}
</span>
</td>

<td>
<input type="checkbox"
${s.paid?"checked":""}
onclick="togglePaid('${s.id}',this.checked)">
</td>

<td class="actions">

${s.request?

`
<button class="warning"
onclick="startRequest('${s.id}')">🚀</button>

<button class="danger"
onclick="deleteSub('${s.id}')">🗑</button>
`

:

`
<button class="main"
onclick="sendWhatsApp('${s.phone}','${s.name}','${s.product}','${endText}',${diff})">💬</button>

<button class="success"
onclick="generatePDF('${s.id}')">🧾</button>

<button class="danger"
onclick="deleteSub('${s.id}')">🗑</button>
`
}

</td>

`;

$("list").appendChild(tr);

});

$("stTotal").textContent=t;
$("stActive").textContent=a;
$("stExpired").textContent=e;
$("stUnpaid").textContent=u;

}
  </script>
</body>
</html>
