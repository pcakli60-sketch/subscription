<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة الاشتراكات</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;padding:15px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
button{padding:8px;border:none;border-radius:6px;cursor:pointer}
.main{background:#1976d2;color:#fff}
.success{background:#2e7d32;color:#fff}
.warning{background:#ef6c00;color:#fff}
.danger{background:#c62828;color:#fff}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#1976d2;color:#fff}
.row-expired{background:#fdecea}
.row-warn{background:#fff3e0}
.row-ok{background:#e8f5e9}
.row-unpaid{background:#fdecea}
</style>
</head>

<body>

<div id="loginBox" class="card" style="max-width:350px;margin:100px auto;text-align:center">
<h3>تسجيل الدخول</h3>
<input id="loginEmail" type="email" placeholder="Email"><br><br>
<input id="loginPass" type="password" placeholder="Password"><br><br>
<button class="main" onclick="login()">دخول</button>
</div>

<div id="app" style="display:none">

<button class="danger" onclick="logout()">Logout</button>

<div class="card">
<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف 0556382694">
<select id="product">
<option value="">الخدمة</option>
<option>Netflix</option>
<option>Shahid</option>
<option>IPTV</option>
</select>
<input id="days" type="number" placeholder="عدد الأيام">
<button class="main" onclick="addSub()">إضافة</button>
</div>

<button class="warning" onclick="sendAlerts()">إرسال جماعي</button>

<div class="card">
<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>الخدمة</th>
<th>الانتهاء</th>
<th>الأيام</th>
<th>مدفوع</th>
<th>إرسال</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

firebase.initializeApp({
apiKey:"AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain:"systeme-des-abonnements-6a98c.firebaseapp.com",
projectId:"systeme-des-abonnements-6a98c"
});

const db=firebase.firestore();
const auth=firebase.auth();

const $=id=>document.getElementById(id);
let subs=[];

function login(){
auth.signInWithEmailAndPassword(
$("loginEmail").value,
$("loginPass").value
).catch(e=>alert(e.message));
}

function logout(){
auth.signOut();
}

auth.onAuthStateChanged(user=>{
$("loginBox").style.display=user?"none":"block";
$("app").style.display=user?"block":"none";
if(user) loadSubs();
});

function loadSubs(){
db.collection("subs")
.orderBy("createdAt","desc")
.onSnapshot(snapshot=>{
subs=[];
snapshot.forEach(doc=>{
subs.push({id:doc.id,...doc.data()});
});
render();
});
}

function calcDays(endISO){
const today=new Date();
today.setHours(0,0,0,0);
const end=new Date(endISO);
end.setHours(0,0,0,0);
return Math.round((end-today)/86400000);
}

function normalizePhone(phone){
phone=phone.replace(/\D/g,"");
if(phone.startsWith("0")){
return "213"+phone.substring(1);
}
return phone;
}

async function addSub(){
let days=parseInt($("days").value);
if(!days||!$("name").value||!$("phone").value||!$("product").value){
alert("أدخل البيانات");
return;
}

let today=new Date();
today.setHours(0,0,0,0);
let end=new Date(today.getTime()+days*86400000);

await db.collection("subs").add({
name:$("name").value,
phone:$("phone").value,
product:$("product").value,
end:end.toISOString(),
paid:false,
alertSent:false,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});

$("name").value="";
$("phone").value="";
$("days").value="";
}

function sendWhatsApp(s){
let diff=calcDays(s.end);
let msg=`اشتراك ${s.product}
${diff<0?"انتهى":"ينتهي"} بتاريخ ${new Date(s.end).toLocaleDateString()}`;
window.open("https://wa.me/"+normalizePhone(s.phone)+"?text="+encodeURIComponent(msg));
}

async function sendAlerts(){
let delay=0;
for(let s of subs){
if(!s.alertSent){
setTimeout(()=>{
sendWhatsApp(s);
},delay);
delay+=700;
await db.collection("subs").doc(s.id).update({alertSent:true});
}
}
}

function render(){
$("list").innerHTML="";
subs.forEach(s=>{
let diff=calcDays(s.end);
let tr=document.createElement("tr");
tr.className=!s.paid?"row-unpaid":diff<0?"row-expired":diff<=3?"row-warn":"row-ok";

tr.innerHTML=`
<td>${s.name}</td>
<td>${s.phone}</td>
<td>${s.product}</td>
<td>${new Date(s.end).toLocaleDateString()}</td>
<td>${diff}</td>
<td><input type="checkbox" ${s.paid?"checked":""}
onclick="db.collection('subs').doc('${s.id}').update({paid:this.checked})"></td>
<td><button class="main" onclick='sendWhatsApp(${JSON.stringify(s)})'>💬</button></td>
`;

$("list").appendChild(tr);
});
}

</script>
</body>
</html>
