<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة الاشتراكات</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0;padding:15px}
h2{text-align:center;color:#1976d2}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
input,select,button{width:100%;padding:10px;margin:5px 0;font-size:14px}
button{border:none;border-radius:6px;cursor:pointer;color:#fff;background:#1976d2}
.success{background:#2e7d32}
.danger{background:#c62828}
.warning{background:#ef6c00}
.logout{background:#c62828;width:auto;padding:6px 12px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:13px}
th{background:#1976d2;color:#fff}
</style>
</head>

<body>

<div id="loginBox" class="card" style="max-width:380px;margin:120px auto;text-align:center">
<h2>🔐 تسجيل الدخول</h2>
<input id="loginEmail" type="email" placeholder="E-mail">
<input id="loginPass" type="password" placeholder="Mot de passe">
<button onclick="login()">دخول</button>
</div>

<div id="app" style="display:none">

<div style="display:flex;justify-content:space-between;align-items:center">
<h2>إدارة الاشتراكات</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="card">
<input id="name" placeholder="اسم الزبون">
<input id="phone" placeholder="الهاتف">
<select id="product">
<option value="">الخدمة</option>
<option>Netflix</option>
<option>Shahid</option>
<option>IPTV</option>
</select>
<input id="days" type="number" placeholder="عدد الأيام">
<button onclick="addSub()">➕ إضافة اشتراك</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>الخدمة</th>
<th>الانتهاء</th>
<th>حذف</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</div>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain: "systeme-des-abonnements-6a98c.firebaseapp.com",
projectId: "systeme-des-abonnements-6a98c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const $ = id => document.getElementById(id);
let subs=[];

/* LOGIN */
function login(){
auth.signInWithEmailAndPassword(
$("loginEmail").value,
$("loginPass").value
).catch(e=>alert(e.message));
}

function logout(){
auth.signOut();
}

auth.onAuthStateChanged(user=>{
$("loginBox").style.display=user?"none":"block";
$("app").style.display=user?"block":"none";
if(user) loadSubs();
});

/* LOAD */
async function loadSubs(){
subs=[];
const snap=await db.collection("subs").get();
snap.forEach(d=>subs.push({id:d.id,...d.data()}));
render();
}

/* ADD */
async function addSub(){
let days=parseInt($("days").value,10);
if(!days||!$("name").value||!$("phone").value||!$("product").value)return;

let end=new Date();
end.setDate(end.getDate()+days);

await db.collection("subs").add({
name:$("name").value,
phone:$("phone").value,
product:$("product").value,
end:end.toISOString()
});

loadSubs();
["name","phone","days"].forEach(i=>$(i).value="");
}

/* DELETE */
async function deleteSub(id){
await db.collection("subs").doc(id).delete();
loadSubs();
}

/* RENDER */
function render(){
$("list").innerHTML="";
subs.forEach(s=>{
let tr=document.createElement("tr");
tr.innerHTML=`
<td>${s.name}</td>
<td>${s.phone}</td>
<td>${s.product}</td>
<td>${new Date(s.end).toLocaleDateString()}</td>
<td><button class="danger" onclick="deleteSub('${s.id}')">🗑</button></td>
`;
$("list").appendChild(tr);
});
}
</script>

</body>
</html>
