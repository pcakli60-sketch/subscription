<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW Subscription Manager</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

/* خلفية BMW */
body{
  height:100vh;
  background:url("https://images.unsplash.com/photo-1549924231-f129b911e442") no-repeat center center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* طبقة تغميق */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  z-index:0;
}

/* Login Glass */
.login-box{
  position:relative;
  z-index:1;
  width:350px;
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.3);
  text-align:center;
  color:#fff;
}

.login-box h2{
  margin-bottom:25px;
  color:#1e88e5;
}

.login-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:30px;
  background:rgba(255,255,255,0.2);
  color:#fff;
}

.login-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:30px;
  background:#1e88e5;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.login-box button:hover{
  background:#1565c0;
}

#app{
  display:none;
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#f4f6f9;
  padding:20px;
  overflow:auto;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.05);
}

button.main{background:#1976d2;color:#fff}
button.danger{background:#c62828;color:#fff}

</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <h2>BMW LOGIN</h2>
  <input type="email" id="loginEmail" placeholder="E-mail">
  <input type="password" id="loginPass" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">
  <div style="display:flex;justify-content:space-between">
    <h2>إدارة الاشتراكات</h2>
    <button class="danger" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <input id="name" placeholder="اسم الزبون">
    <input id="phone" placeholder="الهاتف">
    <button class="main" onclick="addSub()">إضافة</button>
  </div>

  <div class="card">
    <ul id="list"></ul>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
import {
getAuth, signInWithEmailAndPassword, signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* Firebase Config */
const firebaseConfig = {
apiKey: "AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain: "systeme-des-abonnements-6a98c.firebaseapp.com",
projectId: "systeme-des-abonnements-6a98c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

/* LOGIN */
window.login = async function(){
  try{
    await signInWithEmailAndPassword(
      auth,
      $("loginEmail").value.trim(),
      $("loginPass").value.trim()
    );
  }catch(e){
    alert(e.message);
  }
};

window.logout = async function(){
  await signOut(auth);
};

/* AUTH STATE */
onAuthStateChanged(auth,user=>{
  if(user){
    $("loginBox").style.display="none";
    $("app").style.display="block";
    loadSubs();
  }else{
    $("loginBox").style.display="block";
    $("app").style.display="none";
  }
});

/* LOAD DATA */
async function loadSubs(){
  $("list").innerHTML="";
  const snap = await getDocs(collection(db,"subs"));
  snap.forEach(doc=>{
    const li = document.createElement("li");
    li.textContent = doc.data().name + " - " + doc.data().phone;
    $("list").appendChild(li);
  });
}
