<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazid Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#ede7f6;
}

.header{
background:#673ab7;
padding:25px;
text-align:center;
border-radius:0 0 25px 25px;
}

.logo{
width:140px;
}

.selected{
background:white;
margin:15px;
padding:12px;
border-radius:12px;
text-align:center;
font-weight:bold;
}

.services{
background:white;
margin:15px;
padding:15px;
border-radius:16px;
box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.product{
display:flex;
align-items:center;
gap:12px;
padding:14px;
margin-bottom:10px;
border-radius:14px;
border:2px solid #eee;
cursor:pointer;
transition:.2s;
}

.product img{
width:38px;
height:38px;
object-fit:contain;
}

.product.active{
border:2px solid #673ab7;
background:#f3e5f5;
transform:scale(.98);
}

.card{
background:white;
margin:15px;
padding:15px;
border-radius:14px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.label{
font-weight:bold;
margin-bottom:6px;
}

input{
width:100%;
border:none;
border-bottom:2px solid #ddd;
padding:10px 5px;
font-size:15px;
outline:none;
background:transparent;
}

input:focus{
border-bottom:2px solid #673ab7;
}

button{
width:90%;
margin:20px auto;
display:block;
padding:14px;
background:#673ab7;
color:white;
border:none;
border-radius:12px;
font-size:16px;
}

button.sent{
background:#2e7d32;
}

</style>
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
</div>

<div class="selected" id="selected">
اختر المنتج
</div>

<div class="services">

<div class="product" onclick="selectService(this,'ChatGPT')">
<img src="chatgpt.jpg">
<span>ChatGPT</span>
</div>

<div class="product" onclick="selectService(this,'Netflix')">
<img src="netflix.jpg">
<span>Netflix</span>
</div>

<div class="product" onclick="selectService(this,'Disney+')">
<img src="disney.jpg">
<span>Disney+</span>
</div>

<div class="product" onclick="selectService(this,'Prime Video')">
<img src="prime.jpg">
<span>Prime Video</span>
</div>

<div class="product" onclick="selectService(this,'Shahid VIP')">
<img src="shahid.jpg">
<span>Shahid VIP</span>
</div>

<div class="product" onclick="selectService(this,'IPTV')">
<img src="iptv.jpg">
<span>IPTV</span>
</div>

<div class="product" onclick="selectService(this,'Snapchat+')">
<img src="snap.jpg">
<span>Snapchat+</span>
</div>

<div class="product" onclick="selectService(this,'YouTube Premium')">
<img src="youtube.jpg">
<span>YouTube Premium</span>
</div>

<div class="product" onclick="selectService(this,'Game Pass Ultimate')">
<img src="gamepass.jpg">
<span>Game Pass Ultimate</span>
</div>

<div class="product" onclick="selectService(this,'Crunchyroll')">
<img src="crunchyroll.jpg">
<span>Crunchyroll</span>
</div>

<div class="product" onclick="selectService(this,'CapCut Pro')">
<img src="capcut.jpg">
<span>CapCut Pro</span>
</div>

<div class="product" onclick="selectService(this,'Canva Pro')">
<img src="canva.jpg">
<span>Canva Pro</span>
</div>

</div>

<div class="card">
<div class="label">Nom et prénom *</div>
<input id="name" placeholder="Votre réponse">
</div>

<div class="card">
<div class="label">Numéro téléphone *</div>
<input id="phone" placeholder="Votre réponse">
</div>

<button id="sendBtn" onclick="send()">Envoyer</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain:"systeme-des-abonnements-6a98c.firebaseapp.com",
projectId:"systeme-des-abonnements-6a98c",
storageBucket:"systeme-des-abonnements-6a98c.appspot.com",
messagingSenderId:"74948745712",
appId:"1:74948745712:web:ea9140bdf7dafb85baa535"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let selectedService="";
let sending=false;

function selectService(el,name){

document.querySelectorAll(".product").forEach(x=>{
x.classList.remove("active");
});

el.classList.add("active");

selectedService=name;

document.getElementById("selected").innerHTML=
"المنتج المختار : "+name;

}

async function send(){

if(sending) return;

let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();

if(!selectedService){
alert("اختر المنتج");
return;
}

if(!name || !phone){
alert("املأ المعلومات");
return;
}

sending=true;

let snap = await db.collection("subs")
.orderBy("counter","desc")
.limit(1)
.get();

let counter=1;

if(!snap.empty){
counter = snap.docs[0].data().counter + 1;
}

await db.collection("subs").add({
counter:counter,
name:name,
phone:phone,
product:selectedService,
request:true,
paid:false,
createdAt:firebase.firestore.Timestamp.now()
});

alert("✅ تم إرسال الطلب رقم #" + counter);

document.getElementById("name").value="";
document.getElementById("phone").value="";
selectedService="";

document.querySelectorAll(".product").forEach(x=>{
x.classList.remove("active");
});

document.getElementById("selected").innerHTML="اختر المنتج";

sending=false;

}

</script>

</body>
</html>
