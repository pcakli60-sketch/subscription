<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazid Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#ede7f6;
}

.header{
background:#673ab7;
color:white;
padding:20px 15px;
border-radius:0 0 20px 20px;
text-align:center;
}

.logo{
width:140px;
margin:auto;
display:block;
}

.subtitle{
font-size:14px;
margin-top:8px;
opacity:.9;
}

.services{
background:white;
margin:15px;
padding:15px;
border-radius:14px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.services-title{
font-weight:bold;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
text-align:center;
}

.service{
background:#f5f5f5;
padding:10px;
border-radius:10px;
font-size:12px;
}

.form{
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:14px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.label{
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
border:none;
border-bottom:2px solid #ddd;
padding:10px 5px;
font-size:15px;
outline:none;
}

input:focus{
border-bottom:2px solid #673ab7;
}

button{
width:100%;
padding:14px;
background:#673ab7;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

.success{
text-align:center;
color:green;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
<div class="subtitle">Remplissez vos informations</div>
</div>

<div class="services">
<div class="services-title">Abonnements disponibles</div>

<div class="grid">
<div class="service">ChatGPT</div>
<div class="service">Netflix</div>
<div class="service">IPTV</div>
<div class="service">Shahid VIP</div>
<div class="service">Prime Video</div>
<div class="service">Snapchat+</div>
</div>

</div>

<div class="form">

<div class="card">
<div class="label">Nom et prénom *</div>
<input id="name" placeholder="Votre réponse">
</div>

<div class="card">
<div class="label">Numéro téléphone *</div>
<input id="phone" placeholder="Votre réponse">
</div>

<button onclick="send()">Envoyer</button>

<p id="msg" class="success"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain:"systeme-des-abonnements-6a98c.firebaseapp.com",
projectId:"systeme-des-abonnements-6a98c",
storageBucket:"systeme-des-abonnements-6a98c.appspot.com",
messagingSenderId:"74948745712",
appId:"1:74948745712:web:ea9140bdf7dafb85baa535"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

async function send(){

let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();

if(!name || !phone){
alert("Remplir les informations");
return;
}

await db.collection("subs").add({
name:name,
phone:phone,
request:true,
paid:false,
createdAt:firebase.firestore.Timestamp.now()
});

document.getElementById("msg").innerHTML="✅ Demande envoyée";

document.getElementById("name").value="";
document.getElementById("phone").value="";
}
</script>

</body>
</html>
