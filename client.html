<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazid Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#ede7f6;
}

.header{
background:#673ab7;
color:white;
padding:20px;
text-align:center;
border-radius:0 0 20px 20px;
}

.logo{
width:150px;
display:block;
margin:auto;
}

.services{
background:white;
margin:15px;
padding:15px;
border-radius:14px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.services-title{
font-weight:bold;
margin-bottom:5px;
}

.services-desc{
font-size:13px;
color:#666;
margin-bottom:10px;
}

.product{
display:flex;
align-items:center;
gap:10px;
background:white;
padding:12px;
margin-bottom:10px;
border-radius:10px;
border:2px solid #eee;
}

.product img{
width:35px;
height:35px;
}

.product span{
flex:1;
}

.product.active{
border:2px solid #673ab7;
background:#f3e5f5;
}

.product input{
width:18px;
height:18px;
}

.form{
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:14px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.label{
font-weight:bold;
margin-bottom:8px;
}

input[type="text"]{
width:100%;
border:none;
border-bottom:2px solid #ddd;
padding:10px 5px;
font-size:15px;
outline:none;
}

input:focus{
border-bottom:2px solid #673ab7;
}

button{
width:100%;
padding:14px;
background:#673ab7;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}
</style>
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
</div>

<div class="services">

<div class="services-title">
Abonnements disponibles
</div>

<div class="services-title">
📦 اختر المنتج *
</div>

<div class="services-desc">
اختر الاشتراك الذي تريده
</div>

<div class="product" onclick="selectService(this,'ChatGPT')">
<input type="radio" name="product">
<img src="chatgpt.png">
<span>ChatGPT</span>
</div>

<div class="product" onclick="selectService(this,'Netflix')">
<input type="radio" name="product">
<img src="netflix.png">
<span>Netflix</span>
</div>

<div class="product" onclick="selectService(this,'Disney+')">
<input type="radio" name="product">
<img src="disney.png">
<span>Disney+</span>
</div>

<div class="product" onclick="selectService(this,'Prime Video')">
<input type="radio" name="product">
<img src="prime.png">
<span>Prime Video</span>
</div>

<div class="product" onclick="selectService(this,'Shahid VIP')">
<input type="radio" name="product">
<img src="shahid.png">
<span>Shahid VIP</span>
</div>

<div class="product" onclick="selectService(this,'IPTV')">
<input type="radio" name="product">
<img src="iptv.png">
<span>IPTV</span>
</div>

<div class="product" onclick="selectService(this,'Snapchat+')">
<input type="radio" name="product">
<img src="snap.png">
<span>Snapchat+</span>
</div>

<div class="product" onclick="selectService(this,'YouTube Premium')">
<input type="radio" name="product">
<img src="youtube.png">
<span>YouTube Premium</span>
</div>

<div class="product" onclick="selectService(this,'Game Pass Ultimate')">
<input type="radio" name="product">
<img src="gamepass.png">
<span>Game Pass Ultimate</span>
</div>

<div class="product" onclick="selectService(this,'Crunchyroll')">
<input type="radio" name="product">
<img src="crunchyroll.png">
<span>Crunchyroll</span>
</div>

<div class="product" onclick="selectService(this,'CapCut Pro')">
<input type="radio" name="product">
<img src="capcut.png">
<span>CapCut Pro</span>
</div>

<div class="product" onclick="selectService(this,'Canva Pro')">
<input type="radio" name="product">
<img src="canva.png">
<span>Canva Pro</span>
</div>

</div>

<div class="form">

<div class="card">
<div class="label">Nom et prénom *</div>
<input id="name" type="text" placeholder="Votre réponse">
</div>

<div class="card">
<div class="label">Numéro téléphone *</div>
<input id="phone" type="text" placeholder="Votre réponse">
</div>

<button onclick="send()">Envoyer</button>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyBTE_aaLCtUHt5MZq95k7uYCQ1vl7jTQvw",
authDomain:"systeme-des-abonnements-6a98c.firebaseapp.com",
projectId:"systeme-des-abonnements-6a98c",
storageBucket:"systeme-des-abonnements-6a98c.appspot.com",
messagingSenderId:"74948745712",
appId:"1:74948745712:web:ea9140bdf7dafb85baa535"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let selectedService="";

function selectService(el,name){

document.querySelectorAll(".product").forEach(x=>{
x.classList.remove("active");
x.querySelector("input").checked=false;
});

el.classList.add("active");
el.querySelector("input").checked=true;

selectedService=name;

}

async function send(){

let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();

if(!selectedService){
alert("Choisir abonnement");
return;
}

if(!name || !phone){
alert("Remplir les informations");
return;
}

await db.collection("subs").add({
name:name,
phone:phone,
product:selectedService,
request:true,
paid:false,
createdAt:firebase.firestore.Timestamp.now()
});

alert("✅ Demande envoyée");

document.getElementById("name").value="";
document.getElementById("phone").value="";

document.querySelectorAll(".product").forEach(x=>{
x.classList.remove("active");
x.querySelector("input").checked=false;
});

selectedService="";
}
</script>

</body>
</html>
